name: Deploy to IONOS (arsadvocats.com)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Sync to IONOS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SFTP
        env:
          SFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_SERVER: ${{ secrets.FTP_SERVER }}
          SFTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        run: |
          pip install paramiko
          python3 - << 'PYEOF'
          import os, sys, posixpath
          import paramiko

          server = os.environ['SFTP_SERVER']
          user = os.environ['SFTP_USERNAME']
          passwd = os.environ['SFTP_PASSWORD']
          remote_base = '/ars2'

          print(f"Conectando por SFTP a {server}:22 con usuario {user}...")
          ssh = paramiko.SSHClient()
          ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
          ssh.connect(server, port=22, username=user, password=passwd, timeout=30)
          sftp = ssh.open_sftp()
          print("Conexión SFTP exitosa.")

          try:
              sftp.chdir(remote_base)
          except Exception:
              try:
                  sftp.mkdir(remote_base)
                  sftp.chdir(remote_base)
              except Exception as e:
                  print(f"Aviso con directorio {remote_base}: {e}")

          exclude_names = {'.git', '.github', 'ars2-web.zip', 'GEMINI.md', 'rewebars', '.DS_Store'}

          def ensure_remote_dir(remote_path):
              dirs = [d for d in remote_path.split('/') if d]
              current = ''
              for d in dirs:
                  current += '/' + d
                  try:
                      sftp.stat(current)
                  except FileNotFoundError:
                      sftp.mkdir(current)

          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in exclude_names and not d.startswith('.git')]
              rel_dir = os.path.relpath(root, '.')
              if rel_dir == '.':
                  remote_target_dir = remote_base
              else:
                  remote_target_dir = posixpath.join(remote_base, rel_dir.replace('\\', '/'))
              
              ensure_remote_dir(remote_target_dir)

              for f in files:
                  if f in exclude_names or f.startswith('.git'):
                      continue
                  local_file = os.path.join(root, f)
                  remote_file = posixpath.join(remote_target_dir, f)
                  # Upload if missing or modified/different size
                  should_upload = True
                  try:
                      r_stat = sftp.stat(remote_file)
                      l_stat = os.stat(local_file)
                      if r_stat.st_size == l_stat.st_size and abs(r_stat.st_mtime - l_stat.st_mtime) < 2:
                          should_upload = False
                  except FileNotFoundError:
                      should_upload = True

                  if should_upload:
                      print(f"Subiendo: {remote_file}...")
                      sftp.put(local_file, remote_file)
                      try:
                          sftp.utime(remote_file, (l_stat.st_atime, l_stat.st_mtime))
                      except Exception:
                          pass

          sftp.close()
          ssh.close()
          print("¡Despliegue completado con éxito!")
          PYEOF
